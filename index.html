<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milliy Sertifikat RASH - Ro'yxatdan o'tish</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --text-color: #ffffff;
            --hint-color: #8a99ad;
            --border-color: #1e293b;
            --accent-color: #2ea6ff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Premium to'q ko'k-qora gradient fon va naqsh */
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(46, 166, 255, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(15, 23, 42, 0.8) 0%, transparent 50%);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .wrapper {
            width: 100%;
            max-width: 420px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 6px 0;
            color: var(--text-color);
        }

        .header p {
            font-size: 14px;
            color: var(--hint-color);
            margin: 0;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--hint-color);
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 15px;
            background-color: #0f172a;
            color: var(--text-color);
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        select {
            appearance: none;
            cursor: pointer;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .btn-submit:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="card">
            <div class="header">
                <h1>Milliy Sertifikat RASH</h1>
                <p>Ro'yxatdan o'tish uchun ma'lumotlarni kiriting</p>
            </div>
            
            <form id="regForm">
                <div class="input-group">
                    <label for="lastname">Familiyangiz</label>
                    <input type="text" id="lastname" placeholder="Familiyangizni kiriting" required autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="firstname">Ismingiz</label>
                    <input type="text" id="firstname" placeholder="Ismingizni kiriting" required autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="middlename">Otasining ismi</label>
                    <input type="text" id="middlename" placeholder="Otasining ismini kiriting" required autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="region">Viloyat</label>
                    <select id="region" required>
                        <option value="" disabled selected>Viloyatni tanlang</option>
                        <option value="Toshkent viloyati">Toshkent viloyati</option>
                        <option value="Toshkent shahri">Toshkent shahri</option>
                        <option value="Samarqand viloyati">Samarqand viloyati</option>
                        <option value="Farg'ona viloyati">Farg'ona viloyati</option>
                        <option value="Andijon viloyati">Andijon viloyati</option>
                        <option value="Namangan viloyati">Namangan viloyati</option>
                        <option value="Buxoro viloyati">Buxoro viloyati</option>
                        <option value="Qashqadaryo viloyati">Qashqadaryo viloyati</option>
                        <option value="Surxondaryo viloyati">Surxondaryo viloyati</option>
                        <option value="Jizzax viloyati">Jizzax viloyati</option>
                        <option value="Sirdaryo viloyati">Sirdaryo viloyati</option>
                        <option value="Navoiy viloyati">Navoiy viloyati</option>
                        <option value="Xorazm viloyati">Xorazm viloyati</option>
                        <option value="Qoraqalpog'iston Respublikasi">Qoraqalpog'iston Respublikasi</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="district">Tuman yoki shahar</label>
                    <input type="text" id="district" placeholder="Masalan: Chirchiq sh." required autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="phone">Telefon raqamingiz</label>
                    <input type="tel" id="phone" placeholder="+998 90 123 45 67" required autocomplete="off">
                </div>

                <button type="submit" class="btn-submit">Tasdiqlash</button>
            </form>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const phoneInput = document.getElementById('phone');
        phoneInput.addEventListener('input', function (e) {
            let x = e.target.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,2})(\d{0,3})(\d{0,2})(\d{0,2})/);
            if (!x[2]) {
                e.target.value = '+998 ' + x[1];
            } else {
                e.target.value = '+998 (' + x[2] + ') ' + (x[3] ? x[3] + '-' : '') + (x[4] ? x[4] + '-' : '') + (x[5] || '');
            }
        });

        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            let data = {
                lastname: document.getElementById('lastname').value.trim(),
                firstname: document.getElementById('firstname').value.trim(),
                middlename: document.getElementById('middlename').value.trim(),
                region: document.getElementById('region').value,
                district: document.getElementById('district').value.trim(),
                phone: phoneInput.value.trim()
            };

            tg.sendData(JSON.stringify(data));
            tg.close();
        });
    </script>
</body>
</html>
