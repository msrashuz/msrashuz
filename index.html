<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milliy Sertifikat RASH - Premium Ro'yxatdan o'tish</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            --card-bg: #ffffff;
            --text-dark: #333333;
            --text-muted: #777777;
            --accent-gold: #d4af37;
            --accent-blue: #2979ff;
            --error-red: #ff5252;
            --success-green: #00e676;
            --border-color: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--primary-gradient);
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .wrapper {
            width: 100%;
            max-width: 450px;
        }

        .card {
            background: var(--card-bg);
            padding: 30px 22px;
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            animation: slideUpFade 0.6s ease-out;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-gold), var(--accent-blue));
            background-size: 200% 100%;
            animation: shimmerLine 3s infinite linear;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            margin: 0 0 6px 0;
            background: linear-gradient(90deg, var(--accent-blue), var(--text-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0;
        }

        .input-group {
            margin-bottom: 16px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-dark);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            font-size: 16px;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .input-status {
            position: absolute;
            right: 14px;
            font-size: 16px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        input, select {
            width: 100%;
            padding: 14px 40px 14px 42px;
            border: 2px solid var(--border-color);
            border-radius: 14px;
            font-size: 15px;
            background: #fafafa;
            color: var(--text-dark);
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        select {
            appearance: none;
            cursor: pointer;
        }

        input:focus, select:focus {
            border-color: var(--accent-blue);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(41, 121, 255, 0.15);
        }

        input.valid, select.valid {
            border-color: var(--success-green);
        }
        input.valid + .input-icon + .input-status, 
        select.valid ~ .input-status {
            opacity: 1;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(42, 82, 152, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(42, 82, 152, 0.4);
        }

        .btn-submit:active {
            transform: scale(0.97);
        }

        .footer-dev {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.5px;
            animation: pulseGlowText 2s infinite ease-in-out;
        }

        .footer-dev span {
            color: var(--accent-gold);
            font-weight: 700;
        }

        @keyframes slideUpFade {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes shimmerLine {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes pulseGlowText {
            0% { opacity: 0.7; text-shadow: 0 0 5px rgba(212, 175, 55, 0.3); }
            50% { opacity: 1; text-shadow: 0 0 10px rgba(212, 175, 55, 0.6); }
            100% { opacity: 0.7; text-shadow: 0 0 5px rgba(212, 175, 55, 0.3); }
        }

        @keyframes shakeError {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        .error-shake {
            animation: shakeError 0.4s ease-in-out;
            border-color: var(--error-red) !important;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="card">
            <div class="header">
                <h1>Ro'yxatdan o'tish</h1>
                <p>Ma'lumotlaringizni to'liq kiriting</p>
            </div>
            
            <form id="regForm">
                <div class="input-group">
                    <label for="lastname">Familiyangiz</label>
                    <div class="input-wrapper">
                        <input type="text" id="lastname" placeholder="Anvarov" required autocomplete="off">
                        <span class="input-icon">👤</span>
                        <span class="input-status">✅</span>
                    </div>
                </div>

                <div class="input-group">
                    <label for="firstname">Ismingiz</label>
                    <div class="input-wrapper">
                        <input type="text" id="firstname" placeholder="Alisher" required autocomplete="off">
                        <span class="input-icon">👤</span>
                        <span class="input-status">✅</span>
                    </div>
                </div>

                <div class="input-group">
                    <label for="middlename">Otasining ismi</label>
                    <div class="input-wrapper">
                        <input type="text" id="middlename" placeholder="Bahodir o'g'li" required autocomplete="off">
                        <span class="input-icon">👤</span>
                        <span class="input-status">✅</span>
                    </div>
                </div>

                <!-- Viloyatni tanlash -->
                <div class="input-group">
                    <label for="region">Viloyat</label>
                    <div class="input-wrapper">
                        <select id="region" required>
                            <option value="" disabled selected>Viloyatni tanlang</option>
                            <option value="Toshkent viloyati">Toshkent viloyati</option>
                            <option value="Toshkent shahri">Toshkent shahri</option>
                            <option value="Samarqand viloyati">Samarqand viloyati</option>
                            <option value="Farg'ona viloyati">Farg'ona viloyati</option>
                            <option value="Andijon viloyati">Andijon viloyati</option>
                            <option value="Namangan viloyati">Namangan viloyati</option>
                            <option value="Buxoro viloyati">Buxoro viloyati</option>
                            <option value="Qashqadaryo viloyati">Qashqadaryo viloyati</option>
                            <option value="Surxondaryo viloyati">Surxondaryo viloyati</option>
                            <option value="Jizzax viloyati">Jizzax viloyati</option>
                            <option value="Sirdaryo viloyati">Sirdaryo viloyati</option>
                            <option value="Navoiy viloyati">Navoiy viloyati</option>
                            <option value="Xorazm viloyati">Xorazm viloyati</option>
                            <option value="Qoraqalpog'iston Respublikasi">Qoraqalpog'iston Respublikasi</option>
                        </select>
                        <span class="input-icon">📍</span>
                        <span class="input-status">✅</span>
                    </div>
                </div>

                <!-- Tuman yoki shahar -->
                <div class="input-group">
                    <label for="district">Tuman yoki shahar</label>
                    <div class="input-wrapper">
                        <input type="text" id="district" placeholder="Masalan: Chirchiq sh." required autocomplete="off">
                        <span class="input-icon">🏙️</span>
                        <span class="input-status">✅</span>
                    </div>
                </div>

                <div class="input-group">
                    <label for="phone">Telefon raqamingiz</label>
                    <div class="input-wrapper">
                        <input type="tel" id="phone" placeholder="+998 90 123 45 67" required autocomplete="off">
                        <span class="input-icon">📞</span>
                        <span class="input-status">✅</span>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">Tasdiqlash va yuborish</button>
            </form>
        </div>

        <div class="footer-dev">
            developer <span>Iskandarov A.M</span>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const inputs = document.querySelectorAll('input, select');
        inputs.forEach(item => {
            item.addEventListener('blur', (e) => {
                if (e.target.value.trim() !== "") {
                    e.target.classList.add('valid');
                } else {
                    e.target.classList.remove('valid');
                }
            });
            item.addEventListener('focus', (e) => {
                e.target.classList.remove('error-shake');
            });
        });

        const phoneInput = document.getElementById('phone');
        phoneInput.addEventListener('input', function (e) {
            let x = e.target.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,2})(\d{0,3})(\d{0,2})(\d{0,2})/);
            if (!x[2]) {
                e.target.value = '+998 ' + x[1];
            } else {
                e.target.value = '+998 (' + x[2] + ') ' + (x[3] ? x[3] + '-' : '') + (x[4] ? x[4] + '-' : '') + (x[5] || '');
            }
            if (e.target.value.length === 19) {
                e.target.classList.add('valid');
            } else {
                e.target.classList.remove('valid');
            }
        });

        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const lastname = document.getElementById('lastname');
            const firstname = document.getElementById('firstname');
            const middlename = document.getElementById('middlename');
            const region = document.getElementById('region');
            const district = document.getElementById('district');
            const phone = document.getElementById('phone');

            let isValid = true;
            let firstError = null;

            [lastname, firstname, middlename, region, district, phone].forEach(el => {
                if (!el.value.trim()) {
                    el.classList.add('error-shake');
                    setTimeout(() => el.classList.remove('error-shake'), 400);
                    isValid = false;
                    if (!firstError) firstError = el;
                }
            });

            if (!isValid) {
                firstError.focus();
                alert("Iltimos, barchamaydonlarni to'liq to'ldiring!");
                return;
            }

            let data = {
                lastname: lastname.value.trim(),
                firstname: firstname.value.trim(),
                middlename: middlename.value.trim(),
                fullname: `${lastname.value.trim()} ${firstname.value.trim()} ${middlename.value.trim()}`,
                region: region.value,
                district: district.value.trim(),
                phone: phone.value.trim()
            };

            tg.sendData(JSON.stringify(data));
            tg.close();
        });
    </script>
</body>
</html>
