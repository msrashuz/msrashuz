<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milliy Sertifikat RASH - Premium Ro'yxatdan o'tish</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --card-bg: #141418;
            --card-border: #2a2a35;
            --text-main: #ffffff;
            --text-muted: #9ba1a6;
            --accent-red: #ff2a2a;
            --accent-gold: #ffcc00;
            --accent-green: #00ff66;
            --input-bg: #1c1c24;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 42, 42, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 204, 0, 0.06) 0%, transparent 40%);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .wrapper {
            width: 100%;
            max-width: 450px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 30px 22px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.5s ease-out;
        }

        /* Yuqori qismidagi qizil va tillarang neon chiziq */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-red), var(--accent-gold), var(--accent-green));
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            margin: 0 0 6px 0;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .header h1 span {
            color: var(--accent-gold);
        }

        .header p {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0;
        }

        .input-group {
            margin-bottom: 16px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            font-size: 16px;
        }

        .input-status {
            position: absolute;
            right: 14px;
            font-size: 16px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        input, select {
            width: 100%;
            padding: 14px 40px 14px 42px;
            border: 2px solid var(--card-border);
            border-radius: 12px;
            font-size: 15px;
            background: var(--input-bg);
            color: var(--text-main);
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        select {
            appearance: none;
            cursor: pointer;
        }

        input:focus, select:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 12px rgba(255, 204, 0, 0.2);
        }

        input.valid, select.valid {
            border-color: var(--accent-green);
        }
        input.valid + .input-icon + .input-status, 
        select.valid ~ .input-status {
            opacity: 1;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff2a2a 0%, #b30000 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(255, 42, 42, 0.4);
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #ff3b3b 0%, #cc0000 100%);
            box-shadow: 0 8px 25px rgba(255, 42, 42, 0.6);
            transform: translateY(-2px);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .footer-dev {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .footer-dev span {
            color: var(--accent-gold);
            font-weight: 700;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        .error-shake {
            animation: shake 0.4s ease-in-out;
            border-color: var(--accent-red) !important;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="card">
            <div class="header">
                <h1>RASH <span>SERTIFIKAT</span></h1>
                <p>Ma'lumotlaringizni to'liq kiriting</p>
            </div>
            
            <form id="regForm">
                <div class="input-group">
                    <label for="lastname">Familiyangiz</label>
                    <div class="input-wrapper">
                        <input type="text" id="lastname" placeholder="Anvarov" required autocomplete="off">
                        <span class="input-icon">👤</span>
                        <span class="input-status">✅</span>
                    </div>
                </div>

                <div class="input-group">
                    <label for="firstname">Ismingiz</label>
                    <div class="input-wrapper">
                        <input type="text" id="firstname" placeholder="Alisher" required autocomplete="off">
                        <span class="input-icon">👤</span>
                        <span class="input-status">✅</span>
                    </div>
                </div>

                <div class="input-group">
                    <label for="middlename">Otasining ismi</label>
                    <div class="input-wrapper">
                        <input type="text" id="middlename" placeholder="Bahodir o'g'li" required autocomplete="off">
                        <span class="input-icon">👤</span>
                        <span class="input-status">✅</span>
                    </div>
                </div>

                <!-- Viloyat -->
                <div class="input-group">
                    <label for="region">Viloyat</label>
                    <div class="input-wrapper">
                        <select id="region" required>
                            <option value="" disabled selected>Viloyatni tanlang</option>
                            <option value="Toshkent viloyati">Toshkent viloyati</option>
                            <option value="Toshkent shahri">Toshkent shahri</option>
                            <option value="Samarqand viloyati">Samarqand viloyati</option>
                            <option value="Farg'ona viloyati">Farg'ona viloyati</option>
                            <option value="Andijon viloyati">Andijon viloyati</option>
                            <option value="Namangan viloyati">Namangan viloyati</option>
                            <option value="Buxoro viloyati">Buxoro viloyati</option>
                            <option value="Qashqadaryo viloyati">Qashqadaryo viloyati</option>
                            <option value="Surxondaryo viloyati">Surxondaryo viloyati</option>
                            <option value="Jizzax viloyati">Jizzax viloyati</option>
                            <option value="Sirdaryo viloyati">Sirdaryo viloyati</option>
                            <option value="Navoiy viloyati">Navoiy viloyati</option>
                            <option value="Xorazm viloyati">Xorazm viloyati</option>
                            <option value="Qoraqalpog'iston Respublikasi">Qoraqalpog'iston Respublikasi</option>
                        </select>
                        <span class="input-icon">📍</span>
                        <span class="input-status">✅</span>
                    </div>
                </div>

                <!-- Tuman yoki shahar -->
                <div class="input-group">
                    <label for="district">Tuman yoki shahar</label>
                    <div class="input-wrapper">
                        <input type="text" id="district" placeholder="Masalan: Chirchiq sh." required autocomplete="off">
                        <span class="input-icon">🏙️</span>
                        <span class="input-status">✅</span>
                    </div>
                </div>

                <div class="input-group">
                    <label for="phone">Telefon raqamingiz</label>
                    <div class="input-wrapper">
                        <input type="tel" id="phone" placeholder="+998 90 123 45 67" required autocomplete="off">
                        <span class="input-icon">📞</span>
                        <span class="input-status">✅</span>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">Tasdiqlash va yuborish</button>
            </form>
        </div>

        <div class="footer-dev">
            developer <span>Iskandarov A.M</span>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const inputs = document.querySelectorAll('input, select');
        inputs.forEach(item => {
            item.addEventListener('blur', (e) => {
                if (e.target.value.trim() !== "") {
                    e.target.classList.add('valid');
                } else {
                    e.target.classList.remove('valid');
                }
            });
            item.addEventListener('focus', (e) => {
                e.target.classList.remove('error-shake');
            });
        });

        const phoneInput = document.getElementById('phone');
        phoneInput.addEventListener('input', function (e) {
            let x = e.target.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,2})(\d{0,3})(\d{0,2})(\d{0,2})/);
            if (!x[2]) {
                e.target.value = '+998 ' + x[1];
            } else {
                e.target.value = '+998 (' + x[2] + ') ' + (x[3] ? x[3] + '-' : '') + (x[4] ? x[4] + '-' : '') + (x[5] || '');
            }
            if (e.target.value.length === 19) {
                e.target.classList.add('valid');
            } else {
                e.target.classList.remove('valid');
            }
        });

        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const lastname = document.getElementById('lastname');
            const firstname = document.getElementById('firstname');
            const middlename = document.getElementById('middlename');
            const region = document.getElementById('region');
            const district = document.getElementById('district');
            const phone = document.getElementById('phone');

            let isValid = true;
            let firstError = null;

            [lastname, firstname, middlename, region, district, phone].forEach(el => {
                if (!el.value.trim()) {
                    el.classList.add('error-shake');
                    setTimeout(() => el.classList.remove('error-shake'), 400);
                    isValid = false;
                    if (!firstError) firstError = el;
                }
            });

            if (!isValid) {
                firstError.focus();
                alert("Iltimos, barcha maydonlarni to'liq to'ldiring!");
                return;
            }

            let data = {
                lastname: lastname.value.trim(),
                firstname: firstname.value.trim(),
                middlename: middlename.value.trim(),
                fullname: `${lastname.value.trim()} ${firstname.value.trim()} ${middlename.value.trim()}`,
                region: region.value,
                district: district.value.trim(),
                phone: phone.value.trim()
            };

            tg.sendData(JSON.stringify(data));
            tg.close();
        });
    </script>
</body>
</html>
