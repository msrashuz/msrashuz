<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milliy Sertifikat - Ro'yxatdan o'tish</title>
    <!-- Telegram Web App skripti -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--tg-theme-secondary-bg-color, #f4f4f5);
            padding: 20px;
            border-radius: 12px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Ro'yxatdan o'tish</h2>
        <form id="regForm">
            <div class="form-group">
                <label for="fullname">To'liq F.I.Sh. kiriting:</label>
                <input type="text" id="fullname" placeholder="Masalan: Anvarov Alisher" required>
            </div>
            <div class="form-group">
                <label for="phone">Telefon raqamingiz:</label>
                <input type="tel" id="phone" placeholder="+998 90 123 45 67" required>
            </div>
            <button type="submit">Tasdiqlash</button>
        </form>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Oynani to'liq ochish

        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let fullname = document.getElementById('fullname').value;
            let phone = document.getElementById('phone').value;

            // Ma'lumotlarni botga yuborish uchun tayyorlaymiz
            let data = {
                fullname: fullname,
                phone: phone
            };

            // Telegram orqali botga ma'lumot yuborish va oynani yopish
            tg.sendData(JSON.stringify(data));
            tg.close();
        });
    </script>

</body>
</html>
