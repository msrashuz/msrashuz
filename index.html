<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milliy Sertifikat RASH - Ro'yxatdan o'tish</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f4f6f9);
            --text-color: var(--tg-theme-text-color, #1a1a1a);
            --hint-color: var(--tg-theme-hint-color, #8e8e93);
            --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --button-color: var(--tg-theme-button-color, #2f80ed);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .wrapper {
            width: 100%;
            max-width: 420px;
            margin: auto;
        }

        .card {
            background: var(--card-bg);
            padding: 24px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 6px 0;
            color: var(--text-color);
        }

        .header p {
            font-size: 13px;
            color: var(--hint-color);
            margin: 0;
        }

        .input-group {
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text-color);
            opacity: 0.8;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper span {
            position: absolute;
            left: 12px;
            font-size: 15px;
        }

        input, select {
            width: 100%;
            padding: 12px 12px 12px 38px;
            border: 1.5px solid rgba(128, 128, 128, 0.2);
            border-radius: 12px;
            font-size: 14px;
            background: transparent;
            color: var(--text-color);
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--button-color);
        }

        input::placeholder {
            color: var(--hint-color);
            opacity: 0.6;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--button-color);
            color: var(--button-text);
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn-submit:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        /* Developer Animatsiya qismi */
        .footer-dev {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            font-weight: 500;
            color: var(--hint-color);
            letter-spacing: 0.5px;
            animation: pulseGlow 2s infinite ease-in-out;
        }

        .footer-dev span {
            color: var(--button-color);
            font-weight: 700;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); text-shadow: 0 0 8px rgba(47, 128, 237, 0.4); }
            100% { opacity: 0.6; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="card">
            <div class="header">
                <h1>Milliy Sertifikat RASH</h1>
                <p>Ma'lumotlaringizni to'liq va aniq kiriting</p>
            </div>
            
            <form id="regForm">
                <div class="input-group">
                    <label for="lastname">Familiyangiz</label>
                    <div class="input-wrapper">
                        <span>👤</span>
                        <input type="text" id="lastname" placeholder="Masalan: Anvarov" required autocomplete="off">
                    </div>
                </div>

                <div class="input-group">
                    <label for="firstname">Ismingiz</label>
                    <div class="input-wrapper">
                        <span>👤</span>
                        <input type="text" id="firstname" placeholder="Masalan: Alisher" required autocomplete="off">
                    </div>
                </div>

                <div class="input-group">
                    <label for="middlename">Otasining ismi</label>
                    <div class="input-wrapper">
                        <span>👤</span>
                        <input type="text" id="middlename" placeholder="Masalan: Bahodir o'g'li" required autocomplete="off">
                    </div>
                </div>

                <div class="input-group">
                    <label for="region">Viloyat, tuman yoki shahar</label>
                    <div class="input-wrapper">
                        <span>📍</span>
                        <input type="text" id="region" placeholder="Masalan: Toshkent vil., Chirchiq sh." required autocomplete="off">
                    </div>
                </div>

                <div class="input-group">
                    <label for="phone">Telefon raqamingiz</label>
                    <div class="input-wrapper">
                        <span>📞</span>
                        <input type="tel" id="phone" placeholder="+998 90 123 45 67" required autocomplete="off">
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">Tasdiqlash va yuborish</button>
            </form>
        </div>

        <div class="footer-dev">
            developer <span>Iskandarov A.M</span>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Telefon raqam maskasi
        const phoneInput = document.getElementById('phone');
        phoneInput.addEventListener('input', function (e) {
            let x = e.target.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,2})(\d{0,3})(\d{0,2})(\d{0,2})/);
            if (!x[2]) {
                e.target.value = '+998 ' + x[1];
            } else {
                e.target.value = '+998 (' + x[2] + ') ' + (x[3] ? x[3] + '-' : '') + (x[4] ? x[4] + '-' : '') + (x[5] || '');
            }
        });

        // Form yuborilganda ma'lumotlarni yig'ish
        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            let lastname = document.getElementById('lastname').value.trim();
            let firstname = document.getElementById('firstname').value.trim();
            let middlename = document.getElementById('middlename').value.trim();
            let region = document.getElementById('region').value.trim();
            let phone = document.getElementById('phone').value.trim();

            let data = {
                fullname: `${lastname} ${firstname} ${middlename}`,
                region: region,
                phone: phone
            };

            tg.sendData(JSON.stringify(data));
            tg.close();
        });
    </script>
</body>
</html>
